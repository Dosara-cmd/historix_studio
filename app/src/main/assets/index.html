<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HistoriX Studio</title>
    <style>
        :root {
            --bg-primary: #070a12;
            --bg-card: #101726;
            --accent-gold: #e2b714;
            --accent-gradient: linear-gradient(135deg, #e2b714 0%, #b8860b 100%);
            --text-main: #f1f5f9;
            --text-muted: #8892b0;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
        
        .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
        .logo-emblem { width: 54px; height: 54px; background: var(--accent-gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 26px; box-shadow: 0 0 20px rgba(226,183,20,0.3); }
        .header h1 { font-size: 22px; font-weight: 700; color: var(--accent-gold); letter-spacing: 1px; }
        .header p { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1.5px; }
        
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--accent-gold); margin-bottom: 8px; letter-spacing: 1px; display: block; }
        
        select, textarea { width: 100%; padding: 12px; background: #090d16; color: var(--text-main); border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; outline: none; margin-bottom: 14px; }
        textarea { resize: vertical; min-height: 90px; }
        select:focus, textarea:focus { border-color: var(--accent-gold); }

        .btn { width: 100%; padding: 14px; background: var(--accent-gradient); color: #070a12; font-weight: 800; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn:active { opacity: 0.9; }

        .status-box { background: #090d16; border-left: 4px solid var(--accent-gold); padding: 12px; border-radius: 0 10px 10px 0; font-size: 12px; color: var(--text-muted); margin-top: 14px; display: none; line-height: 1.5; }
        .footer { margin-top: auto; text-align: center; font-size: 10px; color: var(--text-muted); padding-top: 15px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-emblem">⏳</div>
        <h1>HistoriX Studio</h1>
        <p>AI Historical Script & Voice Synthesizer</p>
    </div>

    <div class="card">
        <span class="label">Historical Era / Topic</span>
        <textarea id="userInput" placeholder="Enter historical event (e.g., The Battle of Thermopylae)..."></textarea>

        <span class="label">Narrator Voice Profile</span>
        <select id="voiceSelect">
            <option value="sir_arthur">🎙️ Sir Arthur (Deep British Historian)</option>
            <option value="athena">🏛️ Athena (Epic Classical Narrator)</option>
            <option value="marcus">🛡️ Marcus (Commanding Roman Tone)</option>
            <option value="cleopatra">👑 Cleopatra (Royal Cinematic Voice)</option>
            <option value="documentary">📜 Modern History Documentary Style</option>
        </select>

        <span class="label">Generation Mode</span>
        <select id="modeSelect">
            <option value="auto">⚡ Full AI Historical Script Generation</option>
            <option value="manual">✍️ Custom Narration Polish</option>
        </select>

        <button class="btn" onclick="generateContent()">Synthesize History</button>
        
        <div id="statusBox" class="status-box"></div>
    </div>

    <div class="footer">SECURE NATIVE ANDROID ENGINE</div>

    <script>
        function generateContent() {
            const text = document.getElementById('userInput').value;
            const voice = document.getElementById('voiceSelect').selectedOptions[0].text;
            const status = document.getElementById('statusBox');
            
            if(!text.trim()) {
                alert('Please enter a historical topic or script.');
                return;
            }

            status.style.display = 'block';
            status.innerHTML = `⏳ Initializing voice engine...<br>🎙️ Voice: <b>${voice}</b><br>📜 Compiling historical archive...`;
            
            setTimeout(() => {
                status.innerHTML = `✅ <b>Success!</b> Historical script generated & synchronized with selected voice profile.`;
            }, 2500);
        }
    </script>
</body>
</html>
